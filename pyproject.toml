[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wardrobe"
version = "0.4.0"
description = "moosewear: a daily weather-fit ledger for Meta Muse agents - dress for the weather, never repeat an outfit."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Russell Dillin" },
]
keywords = ["agent", "avatar", "wardrobe", "weather", "sqlite", "muse"]
requires-python = ">=3.15"
dependencies = []

[project.urls]
Homepage = "https://github.com/rastreus/moosewear"
Repository = "https://github.com/rastreus/moosewear"
Issues = "https://github.com/rastreus/moosewear/issues"

[project.scripts]
wardrobe = "wardrobe.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wardrobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
